[project]
name = "talktobuy-mvp"
version = "0.1.0"
description = "TalkToBuy MVP workspace: session server and demo store"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/session-server", "services/demo-store"]

[tool.uv.sources]
session-server = { workspace = true }
demo-store = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "datamodel-code-generator>=0.28",
  "jsonschema>=4.23",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["session_server", "demo_store"]

[tool.ruff.lint.per-file-ignores]
"**/models/generated.py" = ["E", "F", "W", "UP", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/session-server/tests", "services/demo-store/tests", "tests/integration"]
markers = [
  "safety: safety regression suite (Constitution II); must pass before every deploy",
  "live: calls real Google Cloud services; never run in CI",
]
addopts = "-m 'not live' --import-mode=importlib"
