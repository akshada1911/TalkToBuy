[project]
name = "session-server"
version = "0.1.0"
description = "TalkToBuy session server: holds the Live session, runs the nine tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "google-genai>=2.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "google-cloud-firestore>=2.19",
  "httpx>=0.27",
  "structlog>=24.4",
  "numpy>=2.1",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_server"]
