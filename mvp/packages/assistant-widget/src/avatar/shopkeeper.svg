<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t">
  <title id="t">दुकानदार (चित्र) / Shopkeeper illustration</title>
  <!-- Background: warm shop wall and a shelf with jars -->
  <rect width="320" height="320" rx="28" fill="#FCE9CF"/>
  <rect x="0" y="92" width="320" height="10" fill="#C9894B"/>
  <rect x="26" y="58" width="26" height="34" rx="6" fill="#F4B860"/>
  <rect x="24" y="52" width="30" height="9" rx="3" fill="#B5652B"/>
  <rect x="62" y="64" width="22" height="28" rx="5" fill="#E8735A"/>
  <rect x="60" y="58" width="26" height="8" rx="3" fill="#8E3B2A"/>
  <rect x="236" y="60" width="24" height="32" rx="6" fill="#9CC5A1"/>
  <rect x="234" y="54" width="28" height="8" rx="3" fill="#4F7F5A"/>
  <rect x="268" y="66" width="26" height="26" rx="5" fill="#F4B860"/>
  <rect x="266" y="60" width="30" height="8" rx="3" fill="#B5652B"/>

  <!-- Body: kurta with a vest -->
  <path d="M70 320 C72 252 104 226 160 226 C216 226 248 252 250 320 Z" fill="#F7F3EA"/>
  <path d="M104 320 C106 262 124 238 146 232 L160 290 L174 232 C196 238 214 262 216 320 Z" fill="#B5652B"/>
  <circle cx="160" cy="262" r="3.5" fill="#7A3E17"/>
  <circle cx="160" cy="280" r="3.5" fill="#7A3E17"/>
  <!-- Neck -->
  <rect x="146" y="200" width="28" height="34" rx="10" fill="#C98B5E"/>

  <!-- Head -->
  <ellipse cx="160" cy="160" rx="58" ry="64" fill="#D99A6C"/>
  <!-- Ears -->
  <ellipse cx="101" cy="166" rx="10" ry="15" fill="#C98B5E"/>
  <ellipse cx="219" cy="166" rx="10" ry="15" fill="#C98B5E"/>
  <!-- Grey hair at the sides and a cap (topi) -->
  <path d="M104 150 C104 124 120 110 136 106 L136 130 C122 134 112 142 108 158 Z" fill="#8C8C8C"/>
  <path d="M216 150 C216 124 200 110 184 106 L184 130 C198 134 208 142 212 158 Z" fill="#8C8C8C"/>
  <path d="M106 122 C112 82 208 82 214 122 C190 112 130 112 106 122 Z" fill="#F7F3EA" stroke="#E2D6C0" stroke-width="3"/>

  <!-- Eyebrows -->
  <path d="M128 140 Q140 132 152 140" stroke="#6B6B6B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M168 140 Q180 132 192 140" stroke="#6B6B6B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Friendly eyes (smiling arcs) -->
  <path d="M130 156 Q140 148 150 156" stroke="#3B2618" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M170 156 Q180 148 190 156" stroke="#3B2618" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Round spectacles -->
  <circle cx="140" cy="156" r="16" fill="none" stroke="#5A4636" stroke-width="3"/>
  <circle cx="180" cy="156" r="16" fill="none" stroke="#5A4636" stroke-width="3"/>
  <path d="M156 156 Q160 152 164 156" stroke="#5A4636" stroke-width="3" fill="none"/>
  <!-- Nose -->
  <path d="M160 160 Q154 178 162 182" stroke="#B57A4E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Moustache -->
  <path d="M132 192 Q146 182 160 190 Q174 182 188 192 Q174 198 160 194 Q146 198 132 192 Z" fill="#8C8C8C"/>
  <!-- Smile -->
  <path d="M142 202 Q160 216 178 202" stroke="#7A3E2A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="122" cy="180" r="9" fill="#E8735A" opacity="0.35"/>
  <circle cx="198" cy="180" r="9" fill="#E8735A" opacity="0.35"/>
</svg>
