<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <title>Live Avatar spike</title>
  <style>
    body { font: 18px system-ui, sans-serif; margin: 24px; background: #fafaf7; color: #1d1d1b; }
    video { width: 360px; background: #000; border-radius: 12px; }
    #log { white-space: pre-wrap; font: 14px ui-monospace, monospace; max-height: 40vh; overflow: auto; }
    button { font-size: 20px; min-height: 48px; padding: 0 20px; }
  </style>
</head>
<body>
  <h1>Live Avatar spike (T009)</h1>
  <button id="start">Start mic + avatar</button>
  <p><video id="v" autoplay playsinline></video></p>
  <p id="cap"></p>
  <div id="log"></div>
<script>
const log = (m) => { const el = document.getElementById("log"); el.textContent = m + "\n" + el.textContent; };
const video = document.getElementById("v");
let ms, sb, queue = [];

function setupMse(mime) {
  // Finding 3: can we play streamed MP4 chunks live? Try the common avatar codec strings.
  const candidates = [mime, 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"', 'video/mp4; codecs="avc1.42E01E"'];
  const type = candidates.find((c) => c && MediaSource.isTypeSupported(c));
  log("MSE type: " + type);
  ms = new MediaSource();
  video.src = URL.createObjectURL(ms);
  ms.addEventListener("sourceopen", () => {
    sb = ms.addSourceBuffer(type);
    sb.mode = "sequence";
    sb.addEventListener("updateend", pump);
    pump();
  });
}
function pump() { if (sb && !sb.updating && queue.length) sb.appendBuffer(queue.shift()); }

document.getElementById("start").onclick = async () => {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "media") {
      if (!ms) setupMse(m.mime);
      queue.push(Uint8Array.from(atob(m.b64), (c) => c.charCodeAt(0)));
      pump();
    } else if (m.type === "caption") {
      document.getElementById("cap").textContent += m.text;
    } else if (m.type === "interrupted") {
      queue = []; log("interrupted");
    } else if (m.type === "stats") {
      document.title = `${m.elapsed_s}s · ${m.chunks} chunks`;
      if (m.chunks % 24 === 1) log(JSON.stringify(m));
    } else { log(JSON.stringify(m)); }
  };
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
  const ctx = new AudioContext({ sampleRate: 16000 });
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(1024, 1, 1); // spike only; the widget uses an AudioWorklet
  proc.onaudioprocess = (ev) => {
    const f = ev.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 0x7fff;
    if (ws.readyState === 1) ws.send(pcm.buffer);
  };
  src.connect(proc); proc.connect(ctx.destination);
  log("mic started; speak Hindi");
};
</script>
</body>
</html>
